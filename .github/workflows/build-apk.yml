name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare project files
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then cp index.html www/index.html; fi
          cat > package.json <<'EOT'
          {
            "name": "budget-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/cli": "^7.0.0",
              "@capacitor/core": "^7.0.0",
              "@capacitor/local-notifications": "^7.0.0"
            }
          }
          EOT
          cat > capacitor.config.json <<'EOT'
          {
            "appId": "com.mymoney.budget",
            "appName": "حاسب مصروفاتي",
            "webDir": "www"
          }
          EOT
          rm -f package-lock.json
      - run: npm install
      - run: npx cap add android
      - name: Add permissions
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: budget-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
